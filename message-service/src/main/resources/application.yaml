server:
  port: 19002

spring:
  application:
    name: message-service

  # 루트의 .env를 프로퍼티로 읽는다. 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 로컬 개발 전용 DB 계정입니다(더미값). 환경변수가 있으면 그 값이 우선.
  datasource:
    url: jdbc:postgresql://localhost:15432/${POSTGRES_DB:bonae}?currentSchema=message_service
    username: ${POSTGRES_USER:bonae}
    password: ${POSTGRES_PASSWORD:local1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # update -> validate
    properties:
      hibernate:
        format_sql: true
        default_schema: message_service
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    schemas: message_service
    default-schema: message_service
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-exclude:
    - /api/internal/**  # 서비스 간 내부 API는 공개 문서에서 제외

slack:
  bot-token: ${SLACK_TOKEN:dummy}
  api-url: https://slack.com/api
  mock: ${SLACK_MOCK:false}
  max-attempts: 3

resilience4j:
  retry:
    instances:
      slack:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.bonae.logistics.message.infrastructure.slack.SlackTransientException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException