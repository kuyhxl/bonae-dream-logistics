server:
  port: 19001

spring:
  application:
    name: user-service

  # 루트의 .env를 프로퍼티로 읽는다. 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 로컬 개발 전용 DB 계정입니다(더미값). 환경변수가 있으면 그 값이 우선.
  datasource:
    url: jdbc:postgresql://localhost:15432/${POSTGRES_DB:bonae}?currentSchema=user_service
    username: ${POSTGRES_USER:bonae}
    password: ${POSTGRES_PASSWORD:local1234}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate        # update -> validate
    properties:
      hibernate:
        format_sql: true
        default_schema: user_service
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    schemas: user_service
    default-schema: user_service
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      master-password-hash: ${MASTER_PASSWORD_HASH}

  jackson:
    time-zone: Asia/Seoul

  cloud:
    openfeign:
      client:
        config:
          default:
            # 외부 API 응답 지연으로 인한 불필요한 대기 방지. 연결 2초, 응답 대기 5초
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-exclude:
    - /api/internal/**  # 서비스 간 내부 API는 공개 문서에서 제외

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간
  refresh-token-expiration: 604800000   # 7일