# 테스트 전용 설정
jwt:
  secret: bG9jYWwtZGV2LW9ubHktbm90LWZvci1wcm9kdWN0aW9uLWJvbmFlLWRyZWFtLWxvZ2lzdGljcw==
  header: Authorization
