# 컨테이너 실행 전용 오버라이드. 기본값(application.yaml)은 로컬 개발 기준을 유지한다.
spring:
  data:
    redis:
      host: redis
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    # 컨테이너 호스트명은 서비스 간 조회가 안되므로 IP로 등록한다
    prefer-ip-address: true

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
