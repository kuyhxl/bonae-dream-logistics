server:
  port: 8080

spring:
  application:
    name: gateway

  # 루트의 .env를 프로퍼티로 읽는다. 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 블랙리스트 조회는 fail-open이므로, 장애 시 기본값(60초)만큼 기다리면
      # 통과시키기 전에 요청이 먼저 묶인다. 짧게 끊고 바로 통과시킨다.
      timeout: 300ms
      connect-timeout: 300ms

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 루트는 매핑된 라우트가 없어 스프링 기본 오류 페이지가 노출된다.
            # 서버 상태를 바로 확인할 수 있도록 헬스체크로 넘기게 한다!
            - id: root-redirect
              uri: no://op
              predicates:
                - Path=/
              filters:
                - RedirectTo=302, /actuator/health

            # API Route
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: message-service
              uri: lb://message-service
              predicates:
                - Path=/api/slack-messages/**

            - id: hub-service
              uri: lb://hub-service
              predicates:
                - Path=/api/hubs/**,/api/hub-routes/**

            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/companies/**,/api/products/**,/api/inventories/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**

            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries/**,/api/delivery-routes/**,/api/delivery-managers/**

            # API Docs Route
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs

            - id: message-service-docs
              uri: lb://message-service
              predicates:
                - Path=/message-service/v3/api-docs
              filters:
                - RewritePath=/message-service/v3/api-docs, /v3/api-docs

            - id: hub-service-docs
              uri: lb://hub-service
              predicates:
                - Path=/hub-service/v3/api-docs
              filters:
                - RewritePath=/hub-service/v3/api-docs, /v3/api-docs

            - id: company-service-docs
              uri: lb://company-service
              predicates:
                - Path=/company-service/v3/api-docs
              filters:
                - RewritePath=/company-service/v3/api-docs, /v3/api-docs

            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/v3/api-docs, /v3/api-docs

            - id: delivery-service-docs
              uri: lb://delivery-service
              predicates:
                - Path=/delivery-service/v3/api-docs
              filters:
                - RewritePath=/delivery-service/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: 1. 유저 서비스
        url: /user-service/v3/api-docs
      - name: 2. 메시지 서비스
        url: /message-service/v3/api-docs
      - name: 3. 허브 서비스
        url: /hub-service/v3/api-docs
      - name: 4. 업체·상품 서비스
        url: /company-service/v3/api-docs
      - name: 5. 주문 서비스
        url: /order-service/v3/api-docs
      - name: 6. 배송 서비스
        url: /delivery-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

jwt:
  secret: ${JWT_SECRET}
  header: Authorization
  prefix: "Bearer "

auth:
  permit-all:
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/signup
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /*-service/v3/api-docs
    - /actuator/health
    - /actuator/health/**
    - /