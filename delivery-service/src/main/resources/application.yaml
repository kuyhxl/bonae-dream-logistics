server:
  port: 19006

spring:
  application:
    name: delivery-service

  # 루트의 .env를 프로퍼티로 읽는다. 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 로컬 개발 전용 DB 계정입니다(더미값). 환경변수가 있으면 그 값이 우선.
  datasource:
    url: jdbc:postgresql://localhost:15432/${POSTGRES_DB:bonae}?currentSchema=delivery_service
    username: ${POSTGRES_USER:bonae}
    password: ${POSTGRES_PASSWORD:local1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # update -> validate
    properties:
      hibernate:
        format_sql: true
        default_schema: delivery_service
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    schemas: delivery_service
    default-schema: delivery_service
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

  cloud:
    openfeign:
      client:
        config:
          company-service:
            connect-timeout: 2000
            read-timeout: 5000
          hub-service:
            connect-timeout: 2000
            read-timeout: 5000
          user-service:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spa

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-exclude:
    - /api/internal/**  # 서비스 간 내부 API는 공개 문서에서 제외
